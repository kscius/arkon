services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigopem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigopem_password}
      POSTGRES_DB: ${POSTGRES_DB:-sigopem_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sigopem -d sigopem_db']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sigopem}:${POSTGRES_PASSWORD:-sigopem_password}@db:5432/${POSTGRES_DB:-sigopem_db}
      POSTGRES_USER: ${POSTGRES_USER:-sigopem}
      POSTGRES_DB: ${POSTGRES_DB:-sigopem_db}
      DB_HOST: db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-480}
      PORT: 8000
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:8080
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
