# ARKON — stack completo aislado (PostgreSQL + API + Web)
# Uso: cp .env.example .env && docker compose up --build
name: arkon

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arkon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkon_password}
      POSTGRES_DB: ${POSTGRES_DB:-arkon_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    networks:
      - arkon_internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-arkon} -d ${POSTGRES_DB:-arkon_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-arkon}:${POSTGRES_PASSWORD:-arkon_password}@db:5432/${POSTGRES_DB:-arkon_db}
      POSTGRES_USER: ${POSTGRES_USER:-arkon}
      POSTGRES_DB: ${POSTGRES_DB:-arkon_db}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-480}
      PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8080}
      UPLOAD_DIR: /app/uploads
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TENANT_ID: ${TENANT_ID:-conagua}
    volumes:
      - uploads:/app/uploads
    ports:
      - '${API_PORT:-8000}:8000'
    networks:
      - arkon_internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"require('http').get('http://127.0.0.1:8000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_TENANT: ${VITE_TENANT:-conagua}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
    ports:
      - '${WEB_PORT:-8080}:80'
    networks:
      - arkon_internal
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  arkon_internal:
    driver: bridge

volumes:
  pgdata:
    name: arkon_pgdata
  uploads:
    name: arkon_uploads
